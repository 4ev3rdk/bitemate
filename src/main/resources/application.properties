#This file stores Spring Boot's application configuration. We'll add the MySQL connection details here,\
#  \ one line at a time.
#pom.xml → Defines project dependencies (Spring Boot, JPA, MySQL driver, etc.) \
#  and build configuration.
#
#application.properties → Stores application settings, \
#  such as the MySQL database name, username, password, and server port.
spring.application.name=bitemate

spring.datasource.url=jdbc:mysql://localhost:3306/bitemate
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
 
#  Hibernate automatically creates missing database tables based on your Java entity
#  classes and updates the schema when needed.\
#  \ It doesn't automatically create your database.
spring.jpa.hibernate.ddl-auto=update
# displays SQL queries generated by Hibernate in the console, useful for learning and debugging.
spring.jpa.show-sql=true  